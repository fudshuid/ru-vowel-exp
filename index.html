<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Эксперимент по восприятию гласных</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background:#f2f2f2; margin:0; color:#222; }
  #app { max-width: 860px; margin: 32px auto; background:#fff; padding: 26px 36px 30px; border-radius: 10px;
         box-shadow: 0 1px 6px rgba(0,0,0,.12); min-height: 420px; font-size: 17px; line-height: 1.45; }
  h1 { font-size: 23px; margin-top: 0; }
  button { font-size: 17px; padding: 8px 16px; margin: 4px; border-radius: 6px; border:1px solid #888; background:#fafafa; cursor:pointer; }
  button:hover:not(:disabled) { background:#eaeaea; } button:disabled { opacity:.45; cursor:default; }
  .big { font-size: 23px; padding: 12px 22px; min-width: 84px; }
  .lab.chosen { background:#bbdefb; opacity:1; }
  .row { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin: 14px 0; }
  .box { width: 120px; height: 88px; border:3px solid #999; border-radius: 10px; display:flex; align-items:center;
         justify-content:center; font-size:30px; color:#555; user-select:none; }
  .box.click { cursor:pointer; border-color:#555; } .box.click:hover { background:#f0f0f0; }
  .box.lit { background:#ffd54f; border-color:#f9a825; }
  .box.correct { background:#a5d6a7; border-color:#2e7d32; } .box.wrong { background:#ef9a9a; border-color:#c62828; }
  .muted { color:#777; font-size: 15px; } .center { text-align:center; }
  .bar { height: 8px; background:#e0e0e0; border-radius:4px; overflow:hidden; margin: 6px 0 16px; }
  .bar > div { height:100%; background:#42a5f5; }
  .warn { color:#c62828; font-weight:600; }
  .testbar { background:#fff3cd; border:1px solid #e0c46c; padding:4px 10px; font-size:14px; margin-bottom:10px; }
  kbd { border:1px solid #aaa; border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size: 14px; background:#fafafa; }
  input[type=text], input[type=number], textarea { font-size: 16px; padding: 5px; width: 60%; }
  .form p { margin: 14px 0; } label.opt { margin-right: 14px; white-space: nowrap; }
  table.prog td, table.prog th { padding: 4px 10px; text-align:left; }
</style>
</head>
<body>
<div id="app">Загрузка…</div>
<noscript>Для участия нужно включить JavaScript.</noscript>
<script src="js/config.js"></script>
<script src="js/texts_ru.js"></script>
<script src="js/synth.js"></script>
<script src="js/design.js"></script>
<script src="js/runner.js"></script>
</body>
</html>
